<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{DIAGRAM_TITLE}}</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 30px;
      background: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
      color: #f8fafc;
    }
    .card {
      background: #090d16;
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 32px 36px;
      width: 100%;
      max-width: 980px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    .header {
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }
    .header h1 {
      margin: 0 0 6px 0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      color: #f8fafc;
    }
    .header p {
      margin: 0;
      font-size: 13px;
      color: #94a3b8;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>{{DIAGRAM_TITLE}}</h1>
      <p>{{DIAGRAM_SUBTITLE}}</p>
    </div>

    <!-- INLINE SVG HERE (Direct from master-architecture-template.svg) -->
    {{INLINE_SVG}}
  </div>
</body>
</html>
