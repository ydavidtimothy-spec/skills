<svg viewBox="0 0 920 900" xmlns="http://www.w3.org/2000/svg" style="background: #020617; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'JetBrains Mono', monospace;">
  <!-- ======================================================================= -->
  <!-- LAVISH ARCHITECTURE SVG MASTER TEMPLATE v2.7.0                          -->
  <!-- RULES:                                                                  -->
  <!-- 1. Layer 1: Boundary Containers                                         -->
  <!-- 2. Layer 2: Connector Paths (Rendered BEHIND all boxes & badges)        -->
  <!-- 3. Layer 3: Component Node Rectangles & Typography                      -->
  <!-- 4. Layer 4: Stage Title Badges (Top-Left on Boundary Line)              -->
  <!-- 5. Layer 5: Protected Badge Shields (All aligned on shared Y baselines) -->
  <!-- ======================================================================= -->

  <defs>
    <!-- Dark subtle dot-grid canvas pattern -->
    <pattern id="lavish-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#1e293b" opacity="0.6"/>
    </pattern>

    <!-- Standard Primary Blue Arrowhead (Happy Path) -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0284c7"/>
    </marker>

    <!-- Rose / Red Arrowhead (Escalation / High-Risk Path) -->
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fb7185"/>
    </marker>

    <!-- Emerald Arrowhead (Success / Output Path) -->
    <marker id="arrow-emerald" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981"/>
    </marker>
  </defs>

  <!-- Background Canvas Grid -->
  <rect width="920" height="900" fill="url(#lavish-grid)" rx="6"/>

  <!-- ======================================================================= -->
  <!-- LAYER 1: REGION BOUNDARIES (45px - 70px Inter-Stage Separation)         -->
  <!-- ======================================================================= -->
  <!-- STAGE 1: INGESTION / TRIAGE BOUNDARY -->
  <rect x="245" y="20" width="420" height="150" rx="4" fill="#0f172a" fill-opacity="0.35" stroke="#334155" stroke-width="1"/>
  
  <!-- STAGE 2: OPERATIONS / PROCESSING BOUNDARY -->
  <rect x="30" y="225" width="820" height="200" rx="4" fill="#0f172a" fill-opacity="0.35" stroke="#334155" stroke-width="1"/>

  <!-- STAGE 3: RESOLUTION ACTIONS BOUNDARY -->
  <rect x="30" y="495" width="820" height="150" rx="4" fill="#0f172a" fill-opacity="0.35" stroke="#334155" stroke-width="1"/>

  <!-- STAGE 4: DOCUMENTATION & RETENTION BOUNDARY -->
  <rect x="30" y="715" width="820" height="150" rx="4" fill="#0f172a" fill-opacity="0.35" stroke="#334155" stroke-width="1"/>

  <!-- ======================================================================= -->
  <!-- LAYER 2: CONNECTOR ARROWS (RENDERED BEHIND ALL BOXES AND BADGES)        -->
  <!-- Symmetrical 3-Lane Pitch: Lane 1 (X=155), Lane 2 (X=455), Lane 3 (X=725)-->
  <!-- Outer Highway: X = 865                                                  -->
  <!-- ======================================================================= -->
  
  <!-- S1 -> S1: Top Component to Bottom Component -->
  <path d="M 455 90 L 455 112" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>

  <!-- S1 -> S2: Stage 1 Exit to Stage 2 Hub -->
  <path d="M 455 160 L 455 255" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>

  <!-- S2: Stage 2 Hub splits into 3 Parallel Lanes -->
  <path d="M 345 280 L 155 280 L 155 350" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <path d="M 455 305 L 455 350" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <path d="M 565 280 L 725 280 L 725 350" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>

  <!-- S2 -> S3: 3 Lanes flow straight down across Stage 2 -> 3 Highway -->
  <path d="M 155 400 L 155 545" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <path d="M 455 400 L 455 545" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <path d="M 725 400 L 725 545" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>

  <!-- S2 -> S4: Red Escalation Outer Right Highway (X = 865) -->
  <path d="M 830 375 L 865 375 L 865 785 L 830 785" fill="none" stroke="#fb7185" stroke-width="1.75" stroke-dasharray="4 4" marker-end="url(#arrow-rose)"/>

  <!-- S3 -> S4: 3 Resolution Lanes converge into Stage 4 Timeline Hub -->
  <path d="M 155 595 L 155 675 L 320 785" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <path d="M 455 595 L 455 760" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <path d="M 725 595 L 725 675 L 570 785" fill="none" stroke="#0284c7" stroke-width="1.75" marker-end="url(#arrow-blue)"/>

  <!-- ======================================================================= -->
  <!-- LAYER 3: COMPONENT BOXES & TYPOGRAPHY (Snappy 2px radius, 50px height)  -->
  <!-- ======================================================================= -->
  
  <!-- STAGE 1 NODES -->
  <g id="node-s1-inbound">
    <rect x="335" y="42" width="240" height="48" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="455" y="62" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Customer Email Inbound</text>
    <text x="455" y="78" fill="#94a3b8" font-size="11" text-anchor="middle">(Gmail Support Queue)</text>
  </g>

  <g id="node-s1-triage">
    <rect x="315" y="112" width="280" height="48" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="455" y="132" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Inbox Triage &amp; Intent Routing</text>
    <text x="455" y="148" fill="#94a3b8" font-size="11" text-anchor="middle">(WISMO • Order Edit • Returns)</text>
  </g>

  <!-- STAGE 2 NODES -->
  <g id="node-s2-hub">
    <rect x="345" y="255" width="220" height="50" rx="2" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="455" y="276" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Order Lookup Hub</text>
    <text x="455" y="292" fill="#38bdf8" font-size="11" text-anchor="middle">(Shopify Admin &amp; Gateways)</text>
  </g>

  <g id="node-s2-lane1">
    <rect x="50" y="350" width="210" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="155" y="371" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">WISMO &amp; Tracking Scan</text>
    <text x="155" y="387" fill="#94a3b8" font-size="11" text-anchor="middle">(17Track / AfterShip Lookup)</text>
  </g>

  <g id="node-s2-lane2">
    <rect x="350" y="350" width="210" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="455" y="371" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Order Modification</text>
    <text x="455" y="387" fill="#94a3b8" font-size="11" text-anchor="middle">(Address &amp; Line Items)</text>
  </g>

  <g id="node-s2-lane3">
    <rect x="620" y="350" width="210" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="725" y="371" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Returns &amp; Defect Review</text>
    <text x="725" y="387" fill="#94a3b8" font-size="11" text-anchor="middle">(Photo Proof &amp; Return Policy)</text>
  </g>

  <!-- STAGE 3 NODES -->
  <g id="node-s3-lane1">
    <rect x="50" y="545" width="210" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="155" y="566" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Send Delivery ETA Update</text>
    <text x="155" y="582" fill="#94a3b8" font-size="11" text-anchor="middle">(Direct Customer Response)</text>
  </g>

  <g id="node-s3-lane2">
    <rect x="350" y="545" width="210" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="455" y="566" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Update Order in Shopify</text>
    <text x="455" y="582" fill="#94a3b8" font-size="11" text-anchor="middle">(Edit Unfulfilled Line Items)</text>
  </g>

  <g id="node-s3-lane3">
    <rect x="620" y="545" width="210" height="50" rx="2" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="725" y="566" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Issue 15% Code / Refund</text>
    <text x="725" y="582" fill="#94a3b8" font-size="11" text-anchor="middle">(Customer Retention Offer)</text>
  </g>

  <!-- STAGE 4 NODES -->
  <g id="node-s4-hub">
    <rect x="290" y="760" width="300" height="52" rx="2" fill="#1e293b" stroke="#0284c7" stroke-width="1.5"/>
    <text x="440" y="782" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Log Notes in Customer Timeline</text>
    <text x="440" y="799" fill="#38bdf8" font-size="11" text-anchor="middle">(Shopify Order History &amp; Close Ticket)</text>
  </g>

  <g id="node-s4-escalation">
    <rect x="615" y="760" width="215" height="52" rx="2" fill="#1e293b" stroke="#fb7185" stroke-width="1.5"/>
    <text x="722" y="782" fill="#ffffff" font-size="12" font-weight="600" text-anchor="middle">Escalate High-Value Cases</text>
    <text x="722" y="799" fill="#fb7185" font-size="11" text-anchor="middle">(Direct to Store Owner Sam)</text>
  </g>

  <!-- ======================================================================= -->
  <!-- LAYER 4: STAGE TITLE BADGES (Dedicated Header Positions)                -->
  <!-- ======================================================================= -->
  
  <!-- STAGE 1 TITLE -->
  <g id="title-s1">
    <rect x="260" y="10" width="190" height="20" rx="2" fill="#090d16" stroke="#0284c7" stroke-width="1"/>
    <text x="355" y="24" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">1. INBOUND SUPPORT TRIAGE</text>
  </g>

  <!-- STAGE 2 TITLE -->
  <g id="title-s2">
    <rect x="45" y="215" width="240" height="20" rx="2" fill="#090d16" stroke="#0284c7" stroke-width="1"/>
    <text x="165" y="229" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">2. SHOPIFY ADMIN OPERATIONS</text>
  </g>

  <!-- STAGE 3 TITLE (Deconflicted 40px below Stage 2->3 transition baseline) -->
  <g id="title-s3">
    <rect x="45" y="485" width="230" height="20" rx="2" fill="#090d16" stroke="#0284c7" stroke-width="1"/>
    <text x="160" y="499" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">3. RESOLUTION ACTIONS &amp; OFFERS</text>
  </g>

  <!-- STAGE 4 TITLE (Deconflicted 40px below Stage 3->4 transition baseline) -->
  <g id="title-s4">
    <rect x="45" y="705" width="230" height="20" rx="2" fill="#090d16" stroke="#0284c7" stroke-width="1"/>
    <text x="160" y="719" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.5">4. DOCUMENTATION &amp; RETENTION</text>
  </g>

  <!-- ======================================================================= -->
  <!-- LAYER 5: 4px MARGIN SHIELD TRANSITION BADGES                            -->
  <!-- ======================================================================= -->
  
  <!-- STAGE 1 -> 2 TRANSITION BADGE -->
  <g id="badge-s1-s2">
    <rect x="400" y="195" width="110" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="455" y="209" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Customer Match</text>
  </g>

  <!-- STAGE 2 INTERNAL BRANCHING BADGES -->
  <g id="badge-s2-lane1">
    <rect x="120" y="270" width="70" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="155" y="284" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Tracking</text>
  </g>
  <g id="badge-s2-lane2">
    <rect x="420" y="315" width="70" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="455" y="329" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Change</text>
  </g>
  <g id="badge-s2-lane3">
    <rect x="690" y="270" width="70" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="725" y="284" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Returns</text>
  </g>

  <!-- STAGE 2 -> 3 TRANSITION BADGES (LOCKED HORIZONTAL BASELINE: Y = 445) -->
  <g id="badge-s2-s3-lane1">
    <rect x="105" y="445" width="100" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="155" y="459" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Carrier ETA</text>
  </g>
  <g id="badge-s2-s3-lane2">
    <rect x="390" y="445" width="130" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="455" y="459" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Address Validated</text>
  </g>
  <g id="badge-s2-s3-lane3">
    <rect x="670" y="445" width="110" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="725" y="459" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Policy Verified</text>
  </g>

  <!-- STAGE 3 -> 4 TRANSITION BADGES (LOCKED HORIZONTAL BASELINE: Y = 665) -->
  <g id="badge-s3-s4-lane1">
    <rect x="150" y="665" width="105" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="202" y="679" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Ticket Resolved</text>
  </g>
  <g id="badge-s3-s4-lane2">
    <rect x="395" y="665" width="120" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="455" y="679" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Changes Saved</text>
  </g>
  <g id="badge-s3-s4-lane3">
    <rect x="615" y="665" width="135" height="20" rx="2" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <text x="682" y="679" fill="#cbd5e1" font-size="10" font-weight="600" text-anchor="middle">Concession Logged</text>
  </g>
  <g id="badge-outer-highway-escalation">
    <rect x="815" y="665" width="100" height="20" rx="2" fill="#090d16" stroke="#fb7185" stroke-width="1.25"/>
    <text x="865" y="679" fill="#fb7185" font-size="10" font-weight="700" text-anchor="middle" letter-spacing="0.3">High Severity</text>
  </g>

</svg>
